# Camera over ground — FALLBACK ONLY.
#
# base_footprint is DEFINED by the camera since 2026-08-17: the point on the
# ground directly below the ZED's stereo centre, +x = camera forward projected
# onto the ground, +z = ground normal. It is NOT the rear axle any more.
#
# The three numbers below are normally NOT read from here. solve_mount.py
# measures them (LiDAR ground plane, carried into the camera through the
# extrinsic) and stores them as a `ground:` block INSIDE the extrinsic yaml;
# calib.sh runs it right after every solve, and sensors.launch.py reads that
# block. They live with the extrinsic on purpose: the plane is expressed
# through that exact R,t, so switching extrinsics (calib -e) switches both.
#
# This file is used only when the active extrinsic has no `ground` block
# (files older than 2026-08). The launch says so in its log when that happens.
# Fix it properly with
#   ros2 run hyu_sensor_bringup solve_mount.py --pcd captures/<session> --write
# on the capture session that produced the extrinsic (a bag works too).
#
# The old anchor (base_footprint -> rslidar: x 0.81, z 0.428, yaw -83.20 and
# a re-solve of the yaw after every calibration) is gone. The LiDAR pose is
# now composed, camera o extrinsic, and needs no number here at all.

camera:
  height: 0.946    # left optical centre above the ground [m]. Tape it, or
                   # take it from a fresh solve_mount.py run — this is the
                   # 2026-08-01 value (captures/20260801_145355, std 2 mm).
  roll_deg: 0.0    # camera body vs the ground normal, ROS body rpy. 0 = assume
  pitch_deg: 0.0   # the camera is level. Measured 2026-08-01: -1.64 / -0.33.

# Cross-check when anything here or in the extrinsic changes: on a bag or the
# car, the ground must sit at z ~= 0 in base_footprint and a cone straight
# ahead of the CAMERA at y ~= 0. The launch prints base_footprint -> rslidar;
# its z should equal ground.lidar_height_m of the extrinsic (~0.54 m) and its
# yaw is whatever the LiDAR was bolted at (~ -83 deg, twisted mount).
