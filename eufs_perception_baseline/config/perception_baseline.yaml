# =============================================================================
# PERCEPTION TUNING SURFACE
# =============================================================================
# Every physically meaningful knob lives in the TUNING block of each node below.
# Anything outside those blocks is plumbing (topics, frames, buffer sizes, clock
# fences) and should not need touching to change perception behaviour.
#
# The four things you are most likely to change:
#
#   1. CONE GEOMETRY      standard_/big_cone_height_m, _radius_m
#                         Measured from THIS simulator's meshes, not the FS-AI
#                         spec. Drives the Tier-3 PnP template. Depth scales
#                         linearly with these: get them wrong and every stereo
#                         cone is wrong by the same ratio.
#
#   2. MONO DEPTH CURVE   monocular_depth_coefficient / _exponent
#                         D = c * (bbox_height_px / image_height_px) ^ e
#                         Camera-specific. Re-fit whenever the camera intrinsics,
#                         mounting, or cone size change.
#
#   3. DETECTION GATES    confidence_threshold, min_bbox_probability,
#                         good_cone_* , cluster_*, sparse_*
#
#   4. COVARIANCES        *_variance_x/_y per depth source. These tell SLAM how
#                         much to trust each tier; they must reflect the tier's
#                         real error, or the graph is corrupted by a confident
#                         wrong measurement.
#
# Tier routing (IIT Bombay 3-tier):
#   LiDAR support        -> Tier 1  (most accurate)
#   good cone, no LiDAR  -> Tier 2  monocular bbox-height curve
#   bad cone,  no LiDAR  -> Tier 3  keypoints -> PnP -> right ROI -> SIFT
# =============================================================================

perception_baseline_node:
  ros__parameters:
    # Simulator bboxes and /custom_camera_info are right-camera based.  The
    # YOLO launch path overrides this primary input with the rectified left view.
    image_topic: /zed/right/image_rect_color
    right_image_topic: /zed/right/image_rect_color
    pointcloud_topic: /velodyne_points
    bbox_topic: /noisy_bounding_boxes
    camera_info_topic: /custom_camera_info
    right_camera_info_topic: /zed/right/camera_info
    camera_frame: zed_right_camera_optical_frame
    right_camera_frame: zed_right_camera_optical_frame
    projection_model: eufs_bbox
    clip_bboxes_to_image: false
    clip_projected_points_to_image: false
    output_cones_topic: /cones
    output_frame: base_footprint
    # Canonicalize cloud-time LiDAR points into bbox-time base_footprint.
    motion_compensation_frame: map
    marker_scale: 0.35
    sync_tolerance_sec: 0.15
    image_sync_tolerance_sec: 0.05
    sync_queue_size: 12
    # 60 Hz stereo history must survive measured ~0.53 s YOLO latency.
    image_sync_queue_size: 64
    # These two are the values this team's working LiDAR path was tuned with on
    # the fullstack branch; main shipped a tighter 0.1/0.09 pair. Keep the
    # looser ones: a stamp arriving further ahead of /clock than
    # max_future_stamp_lead_sec is dropped, so tightening it silently discards
    # sensor frames that Gazebo/DDS delivers early.
    # Invariant: max_future_stamp_lead_sec < timestamp_reset_threshold_sec, so
    # every reset-triggering rollback is wider than the accepted future window.
    timestamp_reset_threshold_sec: 0.5
    max_future_stamp_lead_sec: 0.4
    # Outer bound: a stamp further ahead of /clock than max_future_stamp_lead_sec
    # is buffered until time catches up, and only dropped past THIS value. It is
    # therefore the more permissive of the two and must be >= the one above,
    # or the band between them is dropped instead of deferred.
    max_deferred_future_stamp_lead_sec: 0.6
    # The simulated right camera can deliver the matching acquisition stamp
    # after YOLO has already published its left-image bbox. Wait boundedly for
    # that joint pair instead of prematurely running without stereo context.
    stereo_pair_wait_sec: 0.80
    # Delay output commit until acquisition time is safely behind ROS time so
    # a simultaneously queued /clock rollback invalidates the old result.
    # 0 disables the age gate. It required /clock to advance this far PAST an
    # image's stamp before its boxes could publish, but the worker keeps only the
    # newest frame: the newest is always the youngest, so it always failed the
    # gate and was overwritten before it aged. Measured 8 Hz in -> 1.35 Hz out
    # with a 7.5 Hz sim /clock (133 ms steps) against a 100 ms gate.
    # Clock jumps are already fenced by _clock_generation, and a stamp ahead of
    # /clock is already bounded downstream by max_future_stamp_lead_sec (0.4 s),
    # far beyond the sim clock's lag.
    output_commit_settle_sec: 0.0
    publish_empty_on_sync: false
    fusion_enabled: true
    publish_fusion_debug: true
    fusion_debug_prefix: /fusion/debug

    # Leave empty for the real image/pointcloud baseline path.
    # Set to a simulator cone topic, for example /camera_0/cones or /ground_truth/cones,
    # when testing the SLAM integration before the detector is implemented.
    oracle_cones_topic: ""
    oracle_rewrite_frame: true

    # ========================= TUNING STARTS HERE =========================

    # --- CONE GEOMETRY (shared by every tier) ----------------------------
    # MEASURED FROM THIS SIMULATOR'S MESHES, not the FS-AI competition spec.
    # eufs_tracks/meshes/cone_blue.dae POSITION span x model.sdf <scale>, and
    # cone_big.dae POSITION span x its DAE node <matrix> scale (0.00655834).
    #
    #                   this simulator      FS-AI spec
    #   small cone      0.270 x 0.450 m     0.228 x 0.325 m   <- 38% taller!
    #   big orange      0.261 x 0.526 m     0.285 x 0.505 m
    #
    # Tier-3 PnP depth scales LINEARLY with these numbers, so the spec values
    # would under-estimate small-cone depth by ~28%. Override with the real
    # cone's measurements when porting to the car.
    standard_cone_height_m: 0.450
    standard_cone_radius_m: 0.135
    big_cone_height_m: 0.5255
    big_cone_radius_m: 0.1307

    # --- COVARIANCE PER DEPTH SOURCE -------------------------------------
    # Order in eufs_msgs/ConeWithCovariance is [xx, xy, yx, yy].
    # These are the trust levels handed to GraphSLAM. A tier whose covariance
    # understates its true error will corrupt the map rather than just add
    # noise, because the optimizer will believe it.
    # Roughly: LiDAR (fused/sparse) << stereo < monocular.
    default_variance_x: 0.04
    default_variance_y: 0.04
    fused_variance_x: 0.04
    fused_variance_y: 0.04
    range_variance_scale: 0.0005
    min_variance: 0.0001

    # LiDAR clusters that never matched a camera detection (out of camera FOV,
    # occluded, or a YOLO miss) are still published as unknown-color cones so
    # SLAM/planning can see them. Set false to restore camera-gated output.
    publish_unmatched_lidar_clusters: true
    lidar_only_variance_x: 0.20
    lidar_only_variance_y: 0.20
    # Drop a LiDAR-only cluster within this radius (m) of a cone already made
    # this frame, so a cone the camera also estimated is not duplicated.
    lidar_only_dedup_radius_m: 0.5

    # --- TIER 1: LiDAR-camera association --------------------------------
    roi_min_x: 0.5
    roi_max_x: 30.0
    roi_abs_y: 15.0
    roi_min_z: -0.2
    roi_max_z: 1.5
    ground_min_z: 0.05
    ground_ransac_enabled: true
    ground_ransac_distance_threshold: 0.03
    ground_ransac_max_iterations: 200
    ground_ransac_max_tilt_degrees: 20.0
    ground_ransac_min_inliers: 20
    ground_ransac_seed: 7

    # --- TIER 1: ego-vehicle self mask ------------------------------------
    self_mask_enabled: true
    self_mask_min_x: -1.5
    self_mask_max_x: 1.8
    self_mask_abs_y: 0.8
    self_mask_min_z: -0.4
    self_mask_max_z: 1.4

    # --- TIER 1: cone clustering ------------------------------------------
    cluster_eps: 0.35
    cluster_min_points: 3
    cluster_min_height: 0.02
    cluster_max_height: 0.80
    cluster_max_width: 0.90

    min_bbox_probability: 0.0
    min_projected_points: 1
    min_project_depth: 0.2

    # --- TIER 1: sparse (far/few-point) LiDAR association ------------------
    sparse_association_enabled: true
    sparse_bbox_margin_px: 4.0
    sparse_bbox_margin_ratio: 0.15
    sparse_near_range_m: 6.0
    sparse_far_range_m: 12.0
    sparse_near_min_points: 4
    sparse_mid_min_points: 2
    sparse_far_min_points: 2
    sparse_far_min_probability: 0.25
    sparse_far_min_bbox_width_px: 4.0
    sparse_far_min_bbox_height_px: 4.0
    sparse_max_depth_span_m: 1.0
    sparse_max_depth_span_ratio: 0.35
    sparse_max_width: 0.90
    sparse_variance_x: 0.12
    sparse_variance_y: 0.12

    # --- TIER 2: monocular bbox-height depth -------------------------------
    # Tier 2: D = c * h_n^e, h_n = bbox_height_px / image_height_px.
    #
    # RECALIBRATED FOR THIS CAMERA. The paper's published fit (c=0.498,
    # e=-0.954) is an empirical curve for IIT Bombay's ZED 2i and their cone;
    # the paper itself states the fit must be redone whenever camera placement
    # or optics change. Applied unchanged to this simulator it overestimates
    # depth by ~50% (a 10 m cone reads 15.1 m), and the 30 m gate then silently
    # truncates the map at ~20 m true range instead of erroring.
    #
    # For a pinhole camera and a rigid cone the law is exact:
    #   h_px = fy * H_cone / D  =>  D = (fy * H_cone / H_img) * h_n^-1
    # With this sim's ZED (1280x720, 110 deg HFOV -> fy = 448.13 px) and the
    # measured 0.450 m cone: c = 448.13 * 0.450 / 720 = 0.2801, e = -1.0.
    # The exponent is -1 exactly because the simulated camera is undistorted;
    # the paper's -0.954 absorbs their real lens and mounting.
    # Re-run scripts/fit_mono_depth_curve.py against /ground_truth/cones after
    # any change to the camera xacro or cone model.
    monocular_fallback_enabled: true
    # The curve is a standard-cone calibration. Large/unknown cones have a
    # different height, so they route to stereo rather than take a biased
    # monocular estimate.
    monocular_allowed_colors: "blue,yellow,orange"
    monocular_depth_coefficient: 0.2801
    monocular_depth_exponent: -1.0
    monocular_min_depth_m: 0.5
    monocular_max_depth_m: 30.0
    good_cone_min_height_to_width: 1.2
    good_cone_border_margin_ratio: 0.01
    # Non-paper recovery is disabled because a horizontally clipped cone
    # belongs to the ReKTNet/PnP stereo tier.
    horizontal_clip_fallback_enabled: false
    horizontal_clip_min_probability: 0.70
    horizontal_clip_min_bbox_height_px: 20.0
    horizontal_clip_variance_x: 0.70
    horizontal_clip_variance_y: 1.40
    monocular_variance_x: 0.35
    monocular_variance_y: 0.35

    # --- TIER 3: keypoints -> PnP -> right ROI -> SIFT disparity -----------
    # Tier 3: cone keypoints -> robust PnP -> projected right ROI -> slender
    # left/right SIFT -> disparity depth.  This is the paper's stage ordering;
    # PnP places the right-image search window, and SIFT disparity (not the PnP
    # translation) is the published depth source.
    #
    # The keypoints come from the pose detector's single forward pass rather
    # than a separate ReKTNet crop-inference pass, so rektnet_model_path is
    # unused whenever cone_keypoints_topic is set.  Six keypoints on a standard
    # cone, eight on a big orange one.
    stereo_fallback_enabled: true
    cone_keypoints_topic: /yolo_cone_keypoints
    rektnet_model_path: ""
    rektnet_device: ""
    rektnet_min_heatmap_peak: 0.0
    # Keypoints from a detector are noisier than a dedicated crop network, and
    # the reprojection gate is measured in full-image pixels.
    rektnet_pnp_max_reprojection_error_px: 8.0
    # PnP only places the right-image search window; SIFT disparity produces the
    # depth. The cone is a square pyramid whose apparent width depends on an
    # unobservable yaw, so PnP depth still carries up to ~13% error even with the
    # yaw-averaged template. Pad the ROI enough that this cannot walk the search
    # window off the cone -- a missed ROI loses the cone entirely, whereas an
    # oversized one only costs a few extra SIFT features.
    rektnet_right_roi_padding_ratio: 0.15
    # The PnP template is built from the CONE GEOMETRY block near the top of
    # this file; it is shared with the other tiers rather than duplicated here.

    # Legacy 7-point ReKTNet templates. Only used when rektnet_model_path is set
    # (i.e. no pose detector supplying keypoints).
    rektnet_standard_object_points: [
      0.0, 0.0, 0.0,
      -0.0366666667, 0.1033333333, 0.0,
      0.0366666667, 0.1033333333, 0.0,
      -0.0733333333, 0.2066666667, 0.0,
      0.0733333333, 0.2066666667, 0.0,
      -0.11, 0.31, 0.0,
      0.11, 0.31, 0.0
    ]
    rektnet_large_object_points: [
      0.0, 0.0, 0.0,
      -0.0433333333, 0.1766666667, 0.0,
      0.0433333333, 0.1766666667, 0.0,
      -0.0866666667, 0.3533333333, 0.0,
      0.0866666667, 0.3533333333, 0.0,
      -0.13, 0.53, 0.0,
      0.13, 0.53, 0.0
    ]
    stereo_baseline_m: 0.12
    stereo_min_depth_m: 0.5
    stereo_max_depth_m: 30.0
    stereo_epipolar_tolerance_px: 2.0
    stereo_slender_fraction: 0.5
    stereo_ratio_threshold: 0.75
    # The IIT evaluation found the single best SIFT pair most accurate.
    stereo_min_matches: 1
    stereo_variance_x: 0.50
    stereo_variance_y: 0.50

yolov8_bbox_node:
  ros__parameters:
    image_topic: /zed/left/image_rect_color
    bbox_topic: /yolo_bounding_boxes
    # YOLO26n-pose cone detector: one forward pass yields the box, the class and
    # the cone silhouette keypoints. Shipped inside the package, so there is no
    # dependency on a path outside the workspace. The launch file overrides this
    # with the resolved install-share path; this default serves direct
    # `ros2 run` from a sourced workspace.
    model_path: models/cone_pose_8kpt/weights/best.pt
    confidence_threshold: 0.25
    iou_threshold: 0.45
    imgsz: 640
    device: ""
    max_det: 100
    timestamp_reset_threshold_sec: 0.1
    # 0 disables the age gate. It required /clock to advance this far PAST an
    # image's stamp before its boxes could publish, but the worker keeps only the
    # newest frame: the newest is always the youngest, so it always failed the
    # gate and was overwritten before it aged. Measured 8 Hz in -> 1.35 Hz out
    # with a 7.5 Hz sim /clock (133 ms steps) against a 100 ms gate.
    # Clock jumps are already fenced by _clock_generation, and a stamp ahead of
    # /clock is already bounded downstream by max_future_stamp_lead_sec (0.4 s),
    # far beyond the sim clock's lag.
    output_commit_settle_sec: 0.0
    # Map this weight's class names to the EUFS cone color contract.
    class_map: "blue:blue,yellow:yellow,orange:orange,orange_big:big_orange,undefined:unknown"
    unknown_color_policy: unknown
    publish_debug_image: false
    debug_image_topic: /yolo_bounding_boxes/debug_image
    # Emit the cone keypoints that Tier-3 propagates into the right image.
    publish_keypoints: true
    keypoints_topic: /yolo_cone_keypoints
