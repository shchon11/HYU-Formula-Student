perception_baseline_node:
  ros__parameters:
    image_topic: /zed/left/image_rect_color
    pointcloud_topic: /velodyne_points
    bbox_topic: /noisy_bounding_boxes
    camera_info_topic: /custom_camera_info
    camera_frame: zed_right_camera_optical_frame
    projection_model: eufs_bbox
    clip_bboxes_to_image: false
    clip_projected_points_to_image: false
    output_cones_topic: /cones
    output_frame: base_footprint
    sync_tolerance_sec: 0.15
    publish_empty_on_sync: false
    fusion_enabled: true

    # Leave empty for the real image/pointcloud baseline path.
    # Set to a simulator cone topic, for example /camera_0/cones or /ground_truth/cones,
    # when testing the SLAM integration before the detector is implemented.
    oracle_cones_topic: ""
    oracle_rewrite_frame: true

    # Covariance order in eufs_msgs/ConeWithCovariance is [xx, xy, yx, yy].
    default_variance_x: 0.04
    default_variance_y: 0.04
    fused_variance_x: 0.04
    fused_variance_y: 0.04
    range_variance_scale: 0.0005
    min_variance: 0.0001

    roi_min_x: 0.5
    roi_max_x: 30.0
    roi_abs_y: 15.0
    roi_min_z: -0.2
    roi_max_z: 1.5
    ground_min_z: 0.05

    cluster_eps: 0.35
    cluster_min_points: 3
    cluster_min_height: 0.02
    cluster_max_height: 0.80
    cluster_max_width: 0.90

    min_bbox_probability: 0.0
    min_projected_points: 1
    min_project_depth: 0.2
