perception_baseline_node:
  ros__parameters:
    image_topic: /zed/left/image_rect_color
    pointcloud_topic: /velodyne_points
    bbox_topic: /noisy_bounding_boxes
    camera_info_topic: /custom_camera_info
    camera_frame: zed_right_camera_optical_frame
    projection_model: eufs_bbox
    clip_bboxes_to_image: false
    clip_projected_points_to_image: false
    output_cones_topic: /cones
    output_frame: base_footprint
    marker_scale: 0.35
    sync_tolerance_sec: 0.15
    publish_empty_on_sync: false
    fusion_enabled: true
    publish_fusion_debug: true
    fusion_debug_prefix: /fusion/debug

    # Leave empty for the real image/pointcloud baseline path.
    # Set to a simulator cone topic, for example /camera_0/cones or /ground_truth/cones,
    # when testing the SLAM integration before the detector is implemented.
    oracle_cones_topic: ""
    oracle_rewrite_frame: true

    # Covariance order in eufs_msgs/ConeWithCovariance is [xx, xy, yx, yy].
    default_variance_x: 0.04
    default_variance_y: 0.04
    fused_variance_x: 0.04
    fused_variance_y: 0.04
    range_variance_scale: 0.0005
    min_variance: 0.0001

    roi_min_x: 0.5
    roi_max_x: 40.0
    roi_abs_y: 18.0
    roi_min_z: -0.2
    roi_max_z: 1.5
    ground_min_z: 0.05

    self_mask_enabled: true
    self_mask_min_x: -1.5
    self_mask_max_x: 1.8
    self_mask_abs_y: 0.8
    self_mask_min_z: -0.4
    self_mask_max_z: 1.4

    # Loosened for sparse LiDAR: accept clusters with fewer points and larger
    # neighbourhood so cones farther than a couple of metres still fuse.
    cluster_eps: 0.60
    cluster_min_points: 2
    cluster_min_height: 0.02
    cluster_max_height: 0.90
    cluster_max_width: 1.00

    min_bbox_probability: 0.0
    min_projected_points: 1
    min_project_depth: 0.2

    # Sparse association carries the far cones. Everything here is loosened a
    # lot: fewer points per band (down to a single point past the near zone),
    # the lenient mid band extended out to 18 m, and the far YOLO
    # probability / bbox-size / depth-span gates relaxed.
    sparse_association_enabled: true
    sparse_bbox_margin_px: 8.0
    sparse_bbox_margin_ratio: 0.30
    sparse_near_range_m: 4.0
    sparse_far_range_m: 18.0
    sparse_near_min_points: 2
    sparse_mid_min_points: 1
    sparse_far_min_points: 1
    sparse_far_min_probability: 0.10
    sparse_far_min_bbox_width_px: 2.0
    sparse_far_min_bbox_height_px: 2.0
    sparse_max_depth_span_m: 2.0
    sparse_max_depth_span_ratio: 0.60
    sparse_max_width: 1.00
    sparse_variance_x: 0.12
    sparse_variance_y: 0.12

yolov8_bbox_node:
  ros__parameters:
    image_topic: /zed/left/image_rect_color
    bbox_topic: /yolo_bounding_boxes
    # FSOCO fine-tuned YOLOv8n cone detector. Absolute path to the checkpoint
    # kept under eufs_perception_baseline/models (weights themselves stay out of
    # git). Drop best.pt here when the checkpoint arrives, or override this path.
    model_path: /home/shchon11/fsk/src/eufs_perception_baseline/models/fsoco_yolov8n/weights/best.pt
    confidence_threshold: 0.25
    iou_threshold: 0.45
    imgsz: 640
    # GPU inference on cuda:0 (NVIDIA MX450). Set to "cpu" to force CPU.
    # Use "cuda:0" (not "0") so launch serializes it as a string, not an int.
    device: "cuda:0"
    max_det: 100
    # Map FSOCO class names to the EUFS cone color contract.
    class_map: "blue_cone:blue,yellow_cone:yellow,orange_cone:orange,large_orange_cone:big_orange,unknown_cone:unknown"
    unknown_color_policy: unknown
    publish_debug_image: false
    debug_image_topic: /yolo_bounding_boxes/debug_image
