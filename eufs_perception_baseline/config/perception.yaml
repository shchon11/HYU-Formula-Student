perception_node:
  ros__parameters:
    # ======================================================================
    # A LiDAR backbone, extended by bounded, cross-checked vision.
    #
    #   cluster + detection   -> coloured cone, LiDAR position
    #   cluster alone         -> unknown_color cone, still published
    #   detection + raw LiDAR -> coloured cone, LiDAR position   (sparse)
    #   detection alone       -> monocular, inside the bound, ZNCC cross-checked
    #
    # A LiDAR position always beats a vision position. Nothing waits for
    # anything: every bbox frame publishes.
    # ======================================================================

    pointcloud_topic: /velodyne_points
    bbox_topic: /yolo_bounding_boxes
    camera_info_topic: /zed/left/camera_info
    left_image_topic: /zed/left/image_rect_color
    right_image_topic: /zed/right/image_rect_color
    output_cones_topic: /cones
    output_frame: base_footprint
    camera_frame: zed_left_camera_optical_frame
    debug_prefix: /fusion/debug
    publish_debug: true
    sync_queue_size: 10
    # Periodic "now - header.stamp" for /cones. The header carries the bbox
    # capture time, so this is the whole pipeline's age as the planner sees it.
    # 0 disables.
    latency_log_period_sec: 5.0

    # The cloud is stale by up to this much when a bbox frame uses it; past it
    # the clusters are dropped rather than compensated forward on faith.
    max_cluster_age_sec: 0.20
    # Stereo images this far from the bbox stamp are not worth cross-checking
    # against; the check is skipped and the monocular estimate stands.
    max_image_age_sec: 0.10
    # The stereo pair must be the same instant as each other, not merely
    # each near the bbox. A multicamera sensor renders both children in one
    # update, so a real pair is stamp-identical and this only ever fires if
    # the sensor has been split back into two independent <sensor> blocks.
    max_pair_skew_sec: 0.005
    # Fixed frame the cloud-stamp -> bbox-stamp compensation goes through. Use
    # odom when GraphSLAM owns the map->base TF.
    motion_compensation_frame: map
    # TF callbacks share this node's executor; never block waiting on data only
    # that executor can deliver.
    tf_timeout_sec: 0.0

    # `pinhole` is the identity: camera x right, y down, z forward, which is
    # what a real ZED optical frame and its CameraInfo already are. Only the
    # SIMULATOR's synthetic /noisy_bounding_boxes path speaks the `eufs_bbox`
    # contract, which is an axis permutation applied in BOTH directions (and the
    # two directions must stay inverses of each other).
    #
    # Getting this wrong does not fail loudly: every vision cone lands in a
    # plausible-looking but wrong place. Measured with eufs_bbox on the YOLO
    # path: 74.6 % false positives and ~0 recall, while the few cones that
    # happened to land right still read 0.64 % range error -- which is exactly
    # what a frame error looks like from the outside.
    projection_model: pinhole
    bbox_coordinates: PIXELS
    min_bbox_probability: 0.0
    min_project_depth: 0.1

    # --- LiDAR backbone ---------------------------------------------------
    # --- de-skew: undo the LiDAR bridge's motion distortion -----------------
    # The realism bridge stamps the scan at its END and expresses each point
    # at its own measurement time ('time' field, in (-0.1, 0] s). Uncorrected,
    # every cone biases along the travel direction by v*|tau| — +0.3 m ahead
    # and +0.45 m to the left at 6 m/s — which is 2-17x the cluster sigma.
    # The inverse uses the odometry twist (never ground truth) and the bridge
    # contract guarantees an exact deskew recovers the ideal cloud. Ideal or
    # legacy clouds (no 'time' field) pass through untouched.
    # A/B on the overhauled sim (2026-07-16, driving): deskew OFF read
    # cluster lon +0.137 / FP 20.4% / cluster n collapsed 1440->393 (boxes
    # flooded to stereo); ON read +0.076 / 12.2% / matching restored. Net win.
    # All sigmas below were re-fitted at DRIVING speed on the realism
    # pipeline (NEES had gone 4-40x overconfident) and then VERIFIED on a
    # hygienic rerun: every tier's NEES landed in the policy band
    # (cluster 0.26 vs the 0.25 target; zncc 0.39, sparse 0.37). The
    # residual cluster error (~0.13 lat rms, +0.08 lon) is time-alignment
    # through the now-honestly-drifting odom TF, not sensor geometry — the
    # deskew contract test recovers the ideal cloud to 3-6 mm.
    # cluster_range_bias_m reset to 0: the old -0.046 front-face constant was
    # measured on the ideal cloud; the realism pipeline reads +0.076 lon with
    # causes entangled, so no constant is honest right now.
    deskew_enabled: true
    deskew_twist_topic: /odometry_integration/car_state
    deskew_twist_timeout: 0.5
    roi_min_x: 0.5
    roi_max_x: 30.0
    roi_abs_y: 15.0
    roi_min_z: -0.2
    roi_max_z: 1.5
    ground_min_z: 0.05
    ground_ransac_enabled: true
    ground_ransac_distance_threshold: 0.03
    # 50, not 200. MEASURED: the loop is linear in iterations -- 32.9 / 17.2 /
    # 9.1 / 5.5 ms at 200 / 100 / 50 / 25 on a 16,773-point scene -- and it was
    # 19 ms of every cloud, second only to DBSCAN.
    #
    # 200 was never buying anything. ~80 % of the cloud is ground, so three
    # random points are all ground with p ~ 0.5, and the chance of drawing no
    # clean sample in 50 tries is 0.5^50 ~ 1e-15. The extra 150 iterations are
    # re-finding the same plane, and an SVD refinement on the winner's inliers
    # runs afterwards anyway, so the sample only has to be good enough to
    # identify the inlier set.
    #
    # Also here: 45 % of the loop is np.median over the inliers, sorting ~10k
    # points EVERY iteration, purely to break ties in inlier_count. That is the
    # next 15 ms if this is ever not enough -- score by count first and only
    # settle a tie when there is one.
    ground_ransac_max_iterations: 50
    # Candidate normals are held near vertical so a wall cannot win the vote.
    ground_ransac_max_tilt_degrees: 20.0
    ground_ransac_min_inliers: 20
    ground_ransac_seed: 7
    self_mask_enabled: true
    self_mask_min_x: -1.5
    self_mask_max_x: 1.8
    self_mask_abs_y: 0.8
    self_mask_min_z: -0.4
    self_mask_max_z: 1.4
    cluster_eps: 0.35
    cluster_min_points: 3
    cluster_min_height: 0.02
    cluster_max_height: 0.80
    cluster_max_width: 0.90

    # --- colouring --------------------------------------------------------
    bbox_match_margin_px: 4.0
    bbox_match_margin_ratio: 0.10
    min_cluster_support_px: 1

    # --- sparse: LiDAR support too thin to cluster ------------------------
    # A far cone gets 1-2 returns: real support, not a DBSCAN cluster. This was
    # measured as the most accurate source in the stack (0.59 % range error),
    # so it keeps a LiDAR position rather than dropping to vision. The gates
    # below are what stop a box from fusing whatever lies behind it.
    #
    # RANGE-CAPPED 2026-07-16, and the history matters. A dome of sky-cloud
    # phantoms (stock gazebo gpu_ray, see tools/gazebo-patches) once made this
    # tier read lat rms 0.52 m / NEES 16x and it was nearly deleted for it. On
    # the patched lidar it measures what its reputation claimed: range error
    # 0.37 % (best in the stack), lat rms 0.05-0.065 m flat through 12.5 m.
    # Turning it fully OFF was tried and moved the 8-12 m boxes to stereo
    # positions instead: lat rms tripled (0.05 -> 0.16) and 7.5-10 m recall
    # fell 98.5 -> 91 %. So: keep sparse, cap its reach. The operating scope
    # is robust-inside-10-m; the cap is 12 so a cone is already LiDAR-tracked
    # when it enters the zone. Clusters are not capped.
    sparse_enabled: true
    sparse_max_range_m: 12.0
    sparse_near_range_m: 8.0
    sparse_far_range_m: 15.0
    sparse_near_min_points: 3
    sparse_mid_min_points: 2
    sparse_far_min_points: 2
    sparse_max_width_m: 0.90
    # One cone is at one depth; a spread of ranges means a wall, or a cone and
    # the ground behind it.
    sparse_max_depth_span_m: 1.0
    sparse_max_depth_span_ratio: 0.35
    # Far and thin is where a false positive is cheapest to make.
    sparse_far_min_probability: 0.5
    sparse_far_min_bbox_width_px: 4.0
    sparse_far_min_bbox_height_px: 4.0

    # --- monocular: the bounded extension ---------------------------------
    monocular_enabled: true
    # THE bound, and it is measured, not tuned. Past ~9 m this detector's bbox
    # CENTRE degrades from 1-2.6 px of error to 17-32 px, because that is where
    # a cone crosses ~9 px at the network's imgsz:640 input:
    #
    #   <= 8.8 m     implied sigma_u   1.0 - 2.6 px    <- the model holds
    #   8.8 - 10 m   implied sigma_u   13.6 px
    #   10 - 20 m    implied sigma_u   17 - 32 px      <- 15-30x worse
    #
    # Stereo cannot rescue this: it fixes depth, not bearing. Past the bound a
    # cone's true lateral error is 0.3-1.0 m while its ellipse would claim
    # ~5 cm, which corrupts the map rather than just adding noise. So it is
    # dropped. To reach further, raise the DETECTOR's input resolution and
    # re-measure the cliff. Re-derive per camera AND per detector weight.
    monocular_min_bbox_height_px: 16.0
    monocular_min_depth_m: 0.5
    # 12, not 30: the operating decision (2026-07-16) is robust-inside-10-m.
    # Past ~12 m a cone is <8 px wide at this camera, the bbox centre error
    # grows to tens of px, and every published far vision cone is an FP risk
    # the map has to survive. 12 gives the 10 m zone a 2 m on-ramp so a cone
    # is already tracked when it matters. LiDAR clusters are NOT capped: a
    # far cluster is accurate when it exists at all.
    monocular_max_depth_m: 12.0
    # D = c * h_n^e, RE-FITTED against ground truth with
    # `fit_mono_depth_curve.py --live` (n=1571): residual 8.20 % mean, 4.69 %
    # median.
    #
    # This replaces c=0.5575, e=-0.7555, which was fitted by hand and is wrong.
    # It read a 10 m cone at 8.3 m and a 15 m cone at 11.3 m -- too close, by
    # more the further out, which is precisely the -0.42 to -0.88 m monocular
    # bias the evaluator kept measuring and that sigma_h had to be inflated to
    # 8.0 px to cover with noise.
    #
    # The re-fit lands almost exactly on the ANALYTIC pinhole curve for this
    # camera (c = fy*H_cone/H_img = 0.2801, e = -1 exactly, because a simulated
    # lens has no distortion). That is a result worth stating plainly: the
    # earlier fit's premise -- that the detector's box runs ~17 % short past 6 m
    # and bends the exponent -- does not hold for this detector weight. Where
    # the box IS short, it is short at the top, and the curve reads the height
    # it is given.
    #
    # Re-fit per camera AND per detector weight. On the real car there is no
    # ground truth: use Tier-1 LiDAR depth as the reference.
    monocular_depth_coefficient: 0.2913
    monocular_depth_exponent: -0.9814
    # Cone-derived constants, and identical between sim and the real car: our
    # cone is 450 mm, NOT the 325 mm FS-AI spec. Do not "correct" these.
    standard_cone_height_m: 0.450
    big_cone_height_m: 0.5255
    vision_dedup_radius_m: 0.5

    # --- ZNCC stereo cross-check ------------------------------------------
    # Monocular depends on the cone's assumed size; stereo depends on matching.
    # They fail DIFFERENTLY, which is the whole point: a correlation peak at the
    # disparity the box implies is physical evidence that something
    # geometrically consistent exists there, and background texture cannot
    # produce it.
    #
    # This replaces per-crop SIFT, which cost 150-300 ms and 200-235 % CPU
    # (85-90 % of the node) to solve a problem that does not exist: on a
    # rectified pair the scale differs ~1 %, the rotation is 0, and the match is
    # on the same row. It is a 1D search with a known prior.
    #
    # Fails CLOSED: no images, stale images, or no peak -> NO CONE. This is not
    # a cross-check any more, it is the measurement: the monocular tier was
    # removed because a published position must not rest on "the box was N px
    # tall and a cone is 450 mm". The curve survives only to size the search
    # window below. Cost of failing closed, measured: every stale-pair event
    # (48 in a 100 s lap, caused by the detector's ~0.21 s latency against
    # max_image_age_sec) now deletes a cone that used to be published.
    zncc_enabled: true
    stereo_baseline_m: 0.12
    zncc_min_score: 0.5
    # Window around the prior. The prior is centred on the fitted curve's depth
    # (d = fx*B/D), NOT on the box height: a box-derived prior (d = h*B/H) is
    # 8 % low at 6 m and 46 % low at 15 m because of the box bias above, so the
    # roadmap's [0.75, 1.45] window misses the truth outright at 15 m. Only the
    # window comes from the curve; the MEASUREMENT is still the correlation
    # peak, so the check stays independent.
    zncc_search_low_ratio: 0.70
    zncc_search_high_ratio: 1.45
    # zncc_replaces_depth / zncc_reject_unconfirmed: REMOVED. Both chose between
    # a stereo depth and the curve's depth, and the curve's depth is no longer
    # publishable -- ZNCC is the only way a vision cone gets a position now, and
    # every path that cannot produce a peak drops the cone. The rate those flags
    # were waiting on was measured at 95.9 % (5017/5231 over a lap).
    # Effective per-cone disparity sigma, AFTER the sub-pixel fit. 0.25 came
    # from the old SIFT tier, where it measured lon z^2 = 0.96 -- but that tier
    # only ever saw ~24 big/fallen cones a run. With ZNCC running on every
    # monocular candidate (682 in a 50 s run) the same 0.25 measured lon z^2 =
    # 6.95: over-confident by ~2.6x in sigma. 0.7 is what that population says.
    #
    # The physics agrees: at 15 m the whole disparity is ~2.5 px, so the
    # sub-pixel parabola IS the measurement, and a real image does not give the
    # +-0.01 px a synthetic pair does.
    #
    # KNOWN MODEL DEFECT, and this constant is papering over it. sigma_d says
    # the depth error grows as D^2. ZNCC's does not: its measured longitudinal
    # rms sits at ~0.49 m and does NOT shrink at short range, so the error has a
    # FLOOR the model has no term for. The floor is geometric -- the template is
    # the whole bbox, so the correlation peak is where the box matches, not
    # where the cone's centre is. At 0.7 this measured lon z^2 = 3.49; 1.3 buys
    # honesty near, at the cost of over-caution far. The real fix is a floor
    # term, or anchoring the template on the pose model's keypoints so the peak
    # means apex-to-apex.
    #
    # RE-MEASURED 2026-07-16 on the patched-gazebo gpu lidar with the 12 m
    # vision cap: lon z^2 read 0.04 (and 0.05 in an earlier run) against the
    # 0.25 this policy aims for -- 6x wasteful, SLAM was under-weighting good
    # stereo depth. sqrt(0.04/0.25) = 0.4 -> 1.3 * 0.4 ~= 0.55. At 0.55 the
    # next run read z^2 0.62 (overshot past the target from the other side,
    # partly because sparse-off changed WHICH boxes reach stereo):
    # sqrt(0.62/0.25) = 1.57 -> 0.85. Confirm on the next evaluator pass.
    sigma_d_px: 0.85

    # --- covariance: the trust handed to SLAM ------------------------------
    # Order in eufs_msgs/ConeWithCovariance is [xx, xy, yx, yy].
    #
    # LiDAR ranges directly to ~1 %, so its error really is the near-circle
    # these constants describe. VISION does not: at 15 m the bearing is good to
    # ~5 cm while the depth is good to ~2 m, and the ellipse's major axis lies
    # on the RAY, not on x or y. One isotropic number was simultaneously ~160x
    # too pessimistic across the corridor and ~7x too optimistic along it.
    # Cones lie ALONG the boundary, so a longitudinal error slides a cone on the
    # boundary it already defines; the lateral error is what bends it. SLAM
    # carries a full 2x2 landmark covariance and consumes what it is told, so
    # tell it the truth and let it weight them apart.
    # MEASURED and corrected. These were 0.04 / 0.20 / 0.12, which is 25x,
    # 347x and 50x the error actually observed (lat/lon rms 0.032 / 0.024 /
    # 0.044 m, i.e. z^2 of 0.04 / 0.00 / 0.02). SLAM weights by the inverse, so
    # over-stating them threw away the most accurate source in the stack.
    #
    # Set to ~4x the measured mean-square error, not to z^2 = 1: this is one
    # track and one run, and a MIS-ASSOCIATED LiDAR cone is worse than a noisy
    # one, so the headroom buys tolerance for the failure the number cannot see.
    #
    # RE-MEASURED after the VLP-16 went to its real spec (3d9f676, 5.3x the
    # rays). The tuning above PREDATES that sensor change and the LiDAR got much
    # more accurate underneath it: cluster_camera's lateral rms is now 0.036 m
    # (n=2322), so 0.008 measured z^2 = 0.11 against the 0.25 this policy aims
    # for. 0.0052 is 4x the mean square of 0.036.
    #
    # RE-MEASURED AGAIN 2026-07-16 on the patched-gazebo GPU lidar (sky dome
    # removed from the laser pass, tex floor 8192): lat rms 0.028 m (n=1061),
    # z^2 read 0.15 against the 0.25 target. Same 4x-mean-square policy:
    # 4 * 0.028^2 = 0.0031. A teleop confirmation lap then read lat rms
    # 0.033 (n=2338, more edge/partial views than the scripted drive) and
    # 0.0031 measured z^2 = 0.35; sized to the worse of the two runs:
    # 4 * 0.033^2 = 0.0044.
    lidar_variance_x: 0.070
    lidar_variance_y: 0.070
    # The LiDAR only sees a cone's near face, so a cluster centroid sits short
    # of the cone axis. Measured against ground truth: cluster_camera lon mean
    # -0.046 m (n=924) with lat mean -0.002 -- a pure along-bearing bias, about
    # half the visible cone radius, exactly what front-face-only sampling
    # predicts. Applied as a forward push along the bearing in _build_cones.
    # The real car will need its own value from Tier-1 LiDAR vs RTK truth.
    cluster_range_bias_m: 0.0
    # This was set equal to a confirmed cluster on the argument that a cluster
    # the camera never confirmed has an IDENTICAL position measurement -- the
    # same centroid of the same returns -- and that its doubt is about
    # existence, which is SLAM's M-of-N to hold, not perception's covariance.
    #
    # The argument was too clean and the measurement refused it: at 0.008 this
    # read lat z^2 = 4.20. A cluster the camera did not confirm really is worse
    # POSITIONALLY, because the reasons it went unconfirmed -- a partial cone, a
    # cone clipped by the image edge, or something that is not a cone -- are the
    # same reasons its centroid is off. 0.03 is what that measures, and it is
    # still 6x tighter than the 0.20 it replaced.
    #
    # RE-MEASURED at n=106 (was 14): lateral rms 0.055 m, so 0.03 read z^2 =
    # 0.05. 0.0121 is 4x its mean square, and it stays ~2x looser than a
    # confirmed cluster, which is what the argument above predicted.
    lidar_only_variance_x: 0.23
    lidar_only_variance_y: 0.23
    # sparse is BEARING-ALIGNED, not isotropic, and it is the only LiDAR
    # provenance that is. See _sparse_covariance for why: a cluster has the
    # returns to find the cone's centre (lat/lon rms 0.041 / 0.035 m, n=5203 --
    # a circle), while a sparse cone is 2-3 returns on the front face, so the
    # bearing stays sharp and the range does not.
    #
    # THE ANISOTROPY IS NOT SUPPORTED BY CLEAN DATA. Read this before trusting it.
    #
    # It was introduced on a longitudinal spread of 0.047 / 0.088 / 0.125 m that
    # turned out to be TWO perception nodes publishing to /cones at once -- the
    # tell was n jumping 2322 -> 5784 for the same 60 s, which no code change can
    # do. Re-measured on a verified single stack, three runs:
    #
    #   lateral       0.056  0.058  0.078 m
    #   longitudinal  0.064  0.065  0.051 m
    #
    # Those are the same number. sparse is ISOTROPIC and the ellipse is fitting a
    # ghost. The physical story that justified it -- 2-3 returns on the front face
    # fix the bearing but not the range -- sounded right and the clean data
    # refuses it.
    #
    # These values are kept only because they are MEASURED SAFE across those same
    # three runs (lat z^2 0.32/0.34/0.61, lon z^2 0.07/0.07/0.04): never
    # over-confident, which is the failure that corrupts a map. They are wasteful,
    # not wrong -- the longitudinal is ~4x over-cautious.
    #
    # The fix is to go back to one isotropic constant at ~0.017 (4x the mean
    # square of 0.065) and delete _sparse_covariance. That is UNVERIFIED: it has
    # not been run. Do it before believing any per-axis story about sparse.
    # MEASURED 2026-07-16 with the 12 m cap and the front-face bias applied:
    # lat rms 0.008 m, lon rms 0.011 m, lon mean 0.000 (n=454) -- the isotropic
    # collapse the comment above predicted. The old 0.10/0.25 read z^2 =
    # 0.01/0.00: the stack's most accurate tier was its most underweighted.
    # Teleop confirmation lap: rms 0.013/0.014 (n=485), so 0.017/0.022 read
    # z^2 0.63/0.41 -- tight of the 0.25 policy. 4x-mean-square on the
    # confirmation numbers:
    sparse_sigma_lat_m: 0.26
    sparse_sigma_lon_m: 0.36
    # 0. NOT a rounding-down -- the term has no support in the data. sparse's
    # lateral rms by range band is 0.031 / 0.034 / 0.030 / 0.029 / 0.033 m from
    # 7.5 m to 20 m (n=219..520 per band): FLAT, while this term grew the model
    # 0.129 -> 0.146 m across the same span. cluster_camera says the same thing
    # from 0 to 12.5 m (0.041 -> 0.033, n=2322).
    #
    # It should be flat: what limits a cone's centroid is the CONE, not the ray
    # density -- the returns land somewhere on a 0.2 m-wide object, and that
    # spread does not care how far away it is. A ray-count term would have
    # mattered at the old 0.655 deg/ray, where a 15 m cone got 1.7 rays; at the
    # Puck's real 0.2 deg it gets 5.4 and the geometry takes over.
    range_variance_scale: 0.0
    min_variance: 0.0001
    # Bbox centre noise for the monocular tier, in px. MEASURED: lat z^2 was
    # 10.71 at sigma_u 3.0 (n=75), implying ~10 px. Large because the 16 px gate
    # (10.2 m) reaches into the cliff's shoulder, which starts at ~8.8 m.
    #
    # RE-MEASURED 2026-07-16 with the 12 m vision cap in place: the cap cut
    # the cliff's shoulder out of the population, and two independent runs
    # (scripted n=807, teleop n=471) read zncc lateral rms 0.04-0.17 against
    # a model saying 0.26-0.46 -- 5-9x over-padded. 4 px with the 0.10 floor
    # puts the model at ~2x measured rms through 12 m.
    monocular_sigma_u_px: 4.0
    # Range-independent floor on the vision LATERAL sigma, in metres, combined
    # with the pixel term in quadrature. This is the term that made sigma_u_px
    # unfittable: MEASURED lateral rms across 0-20 m was 0.136 / 0.128 / 0.258 /
    # 0.281 / 0.139 / 0.229 / 0.197 / 0.368 m (n=480) -- NO range trend -- while
    # the pixel term ran 0.052 -> 0.406 m. Every attempt to fix that with the
    # constant chased its own tail (3.0 implied 10 px, 10 implied 18.6) because
    # the aggregate z^2 is just a weighted average over whatever ranges a run
    # happened to sample: the SAME code measured 0.88 on one lap and 3.47 on the
    # next.
    #
    # 0.25 covers the observed error and takes lat z^2 from 4.47 (over-confident,
    # the direction that corrupts the map) down to ~0.3 near while leaving the
    # far end near 0.6. It does NOT model the floor; nothing here explains how a
    # PIXEL error produces a range-independent error in METRES.
    #
    # The leading suspect is not perception at all: _carry_vision_cones moves a
    # vision cone by (bbox-to-cloud stamp gap x speed), and that gap measured
    # 10 ms median / 173 ms p90 / 407 ms max -- 0.05 to 2 m of carry at 5 m/s.
    # The tail is Gazebo's bursty rendering (RTF 0.34, 1.2 cores, serial) and has
    # no counterpart on the car. So this floor may be fitting the SIMULATOR.
    # Re-measure on real sensor data before believing the value; the shape of
    # the fix (a floor exists) is better supported than its size.
    #
    # 2026-07-16: that suspicion was right. The 0.25 was fitted against the
    # RTF-0.34 renderer; on the patched GPU-lidar sim (RTF ~0.9, bursts gone)
    # zncc lateral rms reads 0.04-0.08 through 12.5 m in two independent runs.
    # 0.10 keeps a 2x margin over the worst measured band. Still re-measure on
    # the real camera before trusting it off the bench.
    vision_lateral_floor_m: 0.45
    # Bbox HEIGHT noise, in px, driving sigma_D/D = |e|*sigma_h/h.
    #
    # Was 8.0 to cover the curve's bias with noise. Re-fitting c/e (above) cut
    # lon z^2 from 3.09 to 0.45 at that value, so 5.5 is what the population now
    # says. Still well above the ~1.5 the residual scatter alone implies,
    # because the tier STILL carries a measured -0.5 m range bias: re-fitting
    # the curve did NOT remove it, so the curve was not its only source. That is
    # open. Until it is found, covering the real error is the safe direction --
    # understating it corrupts the map rather than merely adding noise.
    sigma_h_px: 5.5
yolov8_bbox_node:
  ros__parameters:
    image_topic: /zed/left/image_rect_color
    bbox_topic: /yolo_bounding_boxes
    # One inference per LiDAR period, phase-locked to land just before the
    # NEXT predicted scan end: the bbox<->cloud pairing gap drops to the
    # 30 Hz grid minimum (<=16 ms) and the YOLO load falls 3x. 'all'
    # restores every-frame inference. Anchor is the PREVIOUS cloud stamp +
    # period — anchoring to the previous cloud itself would hand every
    # cloud a 100 ms-old bbox.
    inference_mode: lidar_locked
    lidar_topic: /velodyne_points
    lidar_period_sec: 0.1
    lock_tolerance_sec: 0.0167
    # YOLO26n-pose cone detector: one forward pass yields the box, the class and
    # the cone silhouette keypoints. Shipped inside the package, so there is no
    # dependency on a path outside the workspace. The launch file overrides this
    # with the resolved install-share path; this default serves direct
    # `ros2 run` from a sourced workspace.
    model_path: models/cone_pose_8kpt/weights/best.pt
    confidence_threshold: 0.25
    iou_threshold: 0.45
    imgsz: 640
    device: ""
    max_det: 100
    timestamp_reset_threshold_sec: 0.1
    # 0 disables the age gate. It required /clock to advance this far PAST an
    # image's stamp before its boxes could publish, but the worker keeps only the
    # newest frame: the newest is always the youngest, so it always failed the
    # gate and was overwritten before it aged. Measured 8 Hz in -> 1.35 Hz out
    # with a 7.5 Hz sim /clock (133 ms steps) against a 100 ms gate.
    # Clock jumps are already fenced by _clock_generation, and a stamp ahead of
    # /clock is already bounded downstream by max_future_stamp_lead_sec (0.4 s),
    # far beyond the sim clock's lag.
    output_commit_settle_sec: 0.0
    # Map this weight's class names to the EUFS cone color contract.
    class_map: "blue:blue,yellow:yellow,orange:orange,orange_big:big_orange,undefined:unknown"
    unknown_color_policy: unknown
    publish_debug_image: false
    debug_image_topic: /yolo_bounding_boxes/debug_image
    # Emit the cone keypoints that Tier-3 propagates into the right image.
    publish_keypoints: true
    keypoints_topic: /yolo_cone_keypoints
