# DLC-mission local planner tuning. Same structure as hyu_local_planner.yaml;
# the track (dlc_track) is an OPEN corridor with lane changes -- curved, so the
# trackdrive planner tuning is kept as-is (no acceleration-style straight-line
# fit; that would drive the path into the offset lanes). The one behavioural
# difference is the open-end stop: both corridor ends are open, so the path
# speed tapers to zero toward the path end (stop_at_path_end) and the car rolls
# to a planned stop where the cones run out instead of carrying cruise speed
# past the last pair into the controller's fail-safe brake (steering zeroed,
# hard decel). Pair with finish_on_rest in the state machine for the Finished
# report.
hyu_local_planner_node:
  ros__parameters:
    source_mode: slam_map
    cones_topic: /perception/cones
    slam_map_topic: /localization/cone_map
    odom_topic: /localization/ego_odom
    slam_status_topic: /localization/status
    waypoints_topic: /planning/local_waypoints
    path_topic: /planning/local_waypoints/path
    validity_topic: /planning/local_path_valid
    reason_topic: /planning/local_path_reason
    max_stamp_skew_sec: 0.1
    max_input_age_sec: 0.5
    heartbeat_hz: 10.0
    roi_min_x: -1.0
    roi_max_x: 20.0
    roi_abs_y: 8.0
    endpoint_match_tolerance_m: 0.05
    min_track_width_m: 2.0
    max_track_width_m: 6.0
    duplicate_tolerance_m: 0.05
    min_forward_projection_m: 0.10
    max_traversal_gap_m: 6.0
    centerline_max_link_gap_m: 6.0
    max_heading_change_rad: 1.047
    max_u_turn_heading_change_rad: 2.618
    waypoint_spacing_m: 0.5
    max_start_distance_m: 4.0
    two_sided_horizon_m: 20.0
    fallback_horizon_m: 8.0
    fallback_offset_m: 1.5
    two_sided_speed_mps: 3.0
    fallback_speed_mps: 3.0
    # Lateral-accel budget as in hyu_local_planner.yaml: the lane-change jogs
    # are the only curvature here and 3.0 keeps steering margin through them.
    max_lateral_accel_mps2: 3.0
    # Unknown/orange handling as in hyu_local_planner.yaml; the big-orange
    # gates at both corridor ends fold into the boundaries so the entry frame
    # is not orange-only-invalid.
    use_unknown_cones: true
    unknown_absorb_lateral_m: 0.75
    unknown_geom_deadband_m: 0.75
    # Unknown cones beyond this range (m from the ego) that no labelled boundary
    # line explains are dropped instead of split by ego side: far out, the ego's
    # left/right no longer follows the track and a split outside-of-bend cone
    # fabricated boundaries that hooked the path at the map frontier. Orange
    # gate cones are not limited.
    unknown_geom_max_range_m: 6.0
    use_orange_cones: true
    use_live_cone_extension: true
    live_cone_max_age_sec: 0.4
    live_merge_radius_m: 1.0
    live_extension_as_unknown: false
    # Map-first reconciliation of the extension. The path is planned from the
    # map alone AND from map+live cones; the live result is used only where it
    # keeps every map-only waypoint within live_extension_max_deviation_m and
    # its tail past the map frontier turns less than live_extension_max_turn_rad
    # over live_extension_turn_window_m of arc -- a live outlier can then add
    # an honest continuation but never a right-angle hook or a link back along
    # the driven corridor. Anything else falls back to the map-only path.
    live_extension_max_deviation_m: 0.5
    live_extension_max_turn_rad: 1.4
    live_extension_turn_window_m: 1.0
    # Open-end stop. Speed tapers as v = sqrt(2*decel*max(0, remaining-margin))
    # toward the path end, below the min_speed floor (zero is the point). While
    # cruising, the path end is the map/perception frontier well beyond the
    # taper zone (from 6 m/s at 2 m/s^2 the zone is ~9+1 m), so speeds are
    # untouched; only an end that stops advancing -- the open corridor end --
    # walks the car down to rest. DLC-only: on closed-loop missions the path
    # ends at the map frontier every frame and a taper would crawl the lap.
    stop_at_path_end: true
    end_stop_decel_mps2: 2.0
    end_stop_margin_m: 1.0
