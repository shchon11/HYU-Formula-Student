# Skidpad-mission local planner tuning. Same structure as hyu_local_planner.yaml;
# only the speeds are pulled down hard: the mission is two r=9.1 m circles with
# a 3 m corridor, and the circle-to-circle handoff at the junction needs the
# car slow enough to re-acquire the next corridor without overshooting it.
hyu_local_planner_node:
  ros__parameters:
    source_mode: slam_map
    cones_topic: /perception/cones
    slam_map_topic: /localization/cone_map
    odom_topic: /localization/ego_odom
    slam_status_topic: /localization/status
    waypoints_topic: /planning/local_waypoints
    path_topic: /planning/local_waypoints/path
    validity_topic: /planning/local_path_valid
    reason_topic: /planning/local_path_reason
    max_stamp_skew_sec: 0.1
    max_input_age_sec: 0.5
    heartbeat_hz: 10.0
    roi_min_x: -1.0
    roi_max_x: 20.0
    # Wider lateral ROI than the road course: the r=9.1 m circle curves out of a
    # narrow band fast, cutting the path short. 10 m follows more of the arc so
    # the centreline stays long and stable (map+observation), like the base
    # planner on a straight track.
    roi_abs_y: 10.0
    endpoint_match_tolerance_m: 0.05
    min_track_width_m: 2.0
    max_track_width_m: 6.0
    duplicate_tolerance_m: 0.05
    min_forward_projection_m: 0.10
    max_traversal_gap_m: 8.0
    centerline_max_link_gap_m: 8.0
    max_heading_change_rad: 1.047
    # No hairpins on a skidpad -- only two smooth circles. Disable u-turn
    # continuation (== max_heading_change) so that when the smooth circle
    # corridor ends at the mapped frontier the path STOPS cleanly instead of
    # folding back across the circle to the far-side cones (the 60-100 deg kinks
    # that made the centreline zig-zag near the junction).
    max_u_turn_heading_change_rad: 1.047
    waypoint_spacing_m: 0.5
    max_start_distance_m: 4.0
    two_sided_horizon_m: 20.0
    fallback_horizon_m: 8.0
    fallback_offset_m: 1.5
    two_sided_speed_mps: 4.0
    fallback_speed_mps: 2.5
    # Unknown-colour cone handling; see hyu_local_planner.yaml. The skidpad corridor
    # is only 3 m wide, so the absorb band stays tight to avoid pulling a
    # near-centreline cone onto a wall.
    use_unknown_cones: true
    unknown_absorb_lateral_m: 0.6
    unknown_geom_deadband_m: 0.75
    # Unknown cones beyond this range (m from the ego) that no labelled boundary
    # line explains are dropped instead of split by ego side: far out, the ego's
    # left/right no longer follows the track and a split outside-of-bend cone
    # fabricated boundaries that hooked the path at the map frontier. Orange
    # gate cones are not limited.
    unknown_geom_max_range_m: 6.0
    # TEMP DEBUG: print a per-frame [localdiag] line (mode, ROI cone counts,
    # path radius, failure reason). Set false once the left-circle path is fixed.
    log_planner_diagnostics: true
