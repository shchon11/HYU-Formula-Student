# Shared parameters for hyu_global_planner-related nodes. Each node reads only the
# section keyed by its own node name, so launch files can point their
# params_file at this single file without clashing.

hyu_global_planner_trajectory_publisher_node:
  ros__parameters:
    # Trajectory source. Leave trajectory_csv_path empty to resolve the CSV as
    # <output_root>/<map_name>/<trajectory_filename>. If trajectory_csv_path is
    # set, it takes precedence over output_root/map_name.
    trajectory_csv_path: ""
    # CSV mode only (planner_source:=csv). No portable default exists for
    # generated artifacts: pass output_root:=<...>/trajectory_generator/outputs
    # (or trajectory_csv_path) on the launch command line.
    output_root: ""
    map_name: "peanut"
    trajectory_filename: "traj_race_cl.csv"

    # Publishing (data only; visualization lives in the debug visualizer node).
    # This CSV publisher and planner_node are mutually exclusive writers unless
    # both global_waypoints_topic and global_path_valid_topic are remapped.
    global_waypoints_topic: "/global_waypoints"
    # Reliable volatile std_msgs/Bool heartbeat; do not use transient-local.
    global_path_valid_topic: "/planning/global_path_valid"
    valid_heartbeat_hz: 5.0
    frame_id: "map"

    # Reload / validation
    reload_period_sec: 1.0
    duplicate_point_tolerance: 0.0001
    min_waypoint_count: 3
    recompute_s_if_invalid: true

planner_node:
  ros__parameters:
    # Inputs
    cone_map_topic: "/localization/cone_map"
    ego_odom_topic: "/localization/ego_odom"
    graph_slam_status_topic: "/graph_slam/status"
    graph_slam_map_converged_topic: "/graph_slam/map_converged"

    # Outputs. Do not run planner_node and the CSV publisher against these same
    # topics at the same time. /planning/global_path_valid is reliable volatile
    # std_msgs/Bool, not transient-local.
    global_waypoints_topic: "/global_waypoints"
    global_path_valid_topic: "/planning/global_path_valid"
    # Latched std_msgs/String: why the path is invalid ("" while valid).
    global_path_reason_topic: "/planning/global_path_reason"
    valid_heartbeat_hz: 5.0

    # T4 planner algorithm defaults.
    min_cones_per_side: 3
    max_boundary_gap_m: 12.0
    min_track_width_m: 2.0
    max_track_width_m: 6.0
    close_loop_distance_m: 5.0
    # Must be finite and >= 0.05 m; smaller values fail closed.
    waypoint_spacing_m: 0.5
    default_speed_mps: 4.0
    # Curvature+friction speed profile (corner slowdown). Set
    # max_lateral_accel_mps2 to the grip you trust.
    max_speed_mps: 10.0
    min_speed_mps: 3.0
    max_lateral_accel_mps2: 6.0
    max_accel_mps2: 3.0
    max_decel_mps2: 5.0
    duplicate_point_tolerance: 0.001
    odom_timeout_sec: 0.5
    hold_last_valid_path: true
    # Minimum-curvature raceline: solve for the flattest line the cone corridor
    # allows, so it runs wide into a corner, clips the apex and tracks out again.
    # Every point keeps raceline_margin_m clearance to both boundary polylines
    # (margin ~= car half-width + safety), so raceline_margin_m is the real
    # aggression knob: the line may leave the centerline by at most
    # (half track width - raceline_margin_m). 0 iterations = pure centerline.
    #
    # Iterations are solver iterations, not a step count: the objective is
    # convex, so more only tightens convergence. On small_track (211 points)
    # this drops curvature energy 5.06 -> 1.39 (-73%) and peak curvature
    # 0.87 -> 0.19 /m; ~3000 is already at the optimum, 5000 is margin. Costs
    # ~50 ms, and only runs when the cone map changes.
    raceline_smoothing_iterations: 5000
    # THE aggression knob: the line may leave the centerline by at most
    # (corridor half-width - margin). Measured on small_track (half-width
    # 2.02..3.53 m), curvature energy vs margin: 1.2 -> 1.343, 1.4 -> 1.386,
    # 1.6 -> 1.448, 1.8 -> 1.537, 2.0 -> 1.700 (centerline 5.06). 1.4 buys 0.2 m
    # of clearance over 1.2 for +3% energy, holding max deviation to 1.09 m and
    # clearance to 1.40 m. Car half-width is ~0.75 m, so ~0.65 m is left for
    # SLAM, cone and tracking error. Raise it to trade lap time for room; past
    # 2.0 the narrowest sections pin to the centerline outright (budget -> 0).
    raceline_margin_m: 1.4
    # Unused by the min-curvature solver (legacy Laplacian step size). Kept so
    # existing parameter files keep loading unchanged.
    raceline_alpha: 0.3

wpnt_publisher:
  ros__parameters:
    # Republishes the next `waypoint_num` global points ahead of the vehicle,
    # selecting the window by an s-based lookup over /global_waypoints using
    # /car_state/frenet/odom (produced by the hyu_frenet_conversion package).
    global_waypoints_topic: "/global_waypoints"
    # Reliable volatile std_msgs/Bool heartbeat; do not use transient-local.
    global_path_valid_topic: "/planning/global_path_valid"
    global_path_valid_timeout_sec: 0.5
    frenet_odom_topic: "/car_state/frenet/odom"
    path_waypoints_topic: "/path_waypoints"
    path_topic: "/path_waypoints/path"
    waypoint_num: 50
    closed_loop: true
    closing_duplicate_tolerance: 0.001
    # Diagnostic-only cross-check of the frenet segment index against the
    # s-based closest point; warns on disagreement, never changes the output.
    check_segment_index: true


    # Formula TMPC trajectory adapter. The legacy rolling outputs above remain
    # callback-driven and unchanged; these two trajectories are independently
    # rebuilt and published at 20 Hz only in GLOBAL_FULL/GLOBAL_FINAL_STOP.
    ego_odom_topic: "/localization/ego_odom"
    path_source_topic: "/planning/path_source"
    lap_count_topic: "/planning/lap_count"
    tmpc_performance_trajectory_topic: "/tmpc/trajectory_performance"
    tmpc_emergency_trajectory_topic: "/tmpc/trajectory_emergency"
    tmpc_publish_rate_hz: 20.0
    tmpc_input_timeout_sec: 0.5

    # A 3 s trajectory exceeds the Formula controller's approximately 2.46 s
    # prediction horizon. The interval starts slightly behind the vehicle.
    tmpc_foresight_time_sec: 3.0
    tmpc_min_horizon_m: 10.0
    tmpc_max_horizon_m: 30.0
    tmpc_start_behind_m: 0.5
    tmpc_min_sample_distance_m: 0.0001

    # Flat simulation track; fixed lateral corridor half-widths handed to the
    # TUM tube MPC. 1.0 m per side exceeds the raceline's guaranteed boundary
    # slack (margin 1.4 m - car half-width 0.75 m = 0.65 m), so the tube can
    # authorize up to ~0.35 m outside the corridor the raceline was solved for.
    # TODO(tmpc): derive per-point from boundary distance, or drop to <= 0.6.
    tmpc_banking_rad: 0.0
    tmpc_tube_l_m: 1.0
    tmpc_tube_r_m: 1.0

    # Match the generated Formula path-matching safety check. Change these in
    # lock-step with regenerated Formula code.
    tmpc_emergency_decel_scale: 0.95
    tmpc_emergency_final_speed_mps: 0.5
    tmpc_drag_coefficient: 1.4
    tmpc_air_density_kgpm3: 1.22
    tmpc_vehicle_mass_kg: 225.0
    tmpc_acceleration_utilization_limit: 1.0
    # TMPC reference-speed cap (0 disables). The raceline itself is drivable at
    # ~9 m/s under MAP, but the tube MPC still fights the plant's 0.2 s command
    # dead time; beyond ~7 m/s on tight tracks its corrections land too late
    # (observed: steering saturation -> diverged QP at the first corner after
    # takeover). Raise once the dead time is fully compensated.
    tmpc_performance_speed_cap_mps: 6.5

    # The launch sets formula_north_zero for the CSV writer and ros_yaw for the
    # SLAM writer. Direct ros2 run defaults to the SLAM convention.
    tmpc_input_heading_convention: "ros_yaw"

    # The node defaults this path to the installed hyu_global_planner share copy of
    # trajectory_generator/inputs/veh_dyn_info/ggv.csv. Set it to an empty
    # string to use the fallback vectors below instead.
    tmpc_ggv_speed_mps: [0.0, 8.5]
    tmpc_ggv_ax_max_mps2: [11.772, 11.772]
    tmpc_ggv_ay_max_mps2: [20.6428571429, 20.6428571429]
    tmpc_ggv_ax_decel_max_mps2: [9.81, 9.81]

frenet_odom_node:
  ros__parameters:
    # EUFS simulation publishes vehicle odometry on /ground_truth/odom. For a
    # localization stack, override launch arg odom_topic:=/pf/pose/odom.
    odom_topic: "/ground_truth/odom"
    waypoint_topic: "/global_waypoints"
    # Reliable volatile std_msgs/Bool heartbeat; do not use transient-local.
    global_path_valid_topic: "/planning/global_path_valid"
    global_path_valid_timeout_sec: 0.5
    frenet_odom_topic: "/car_state/frenet/odom"
    debug_topic: "/car_state/frenet/debug"
    frenet_frame_id: "frenet"
    closed_loop: true
    publish_debug: true

hyu_global_planner_debug_visualizer_node:
  ros__parameters:
    # Layer CSVs are resolved as <output_root>/<map_name>/<*_filename>.
    # Debug-only node: pass output_root:=<...>/trajectory_generator/outputs.
    output_root: ""
    map_name: "peanut"

    # Publishing
    frame_id: "map"
    markers_topic: "/hyu_global_planner/debug/markers"
    marker_line_width: 0.1
    close_loops: true

    # Reload
    reload_period_sec: 1.0

    # Layer sources (Formula Student colours are fixed in the node:
    #   left boundary = blue, right boundary = yellow, centerline = red,
    #   minimum-curvature raceline = green).
    # left/right boundaries come from the periodic-spline export
    # (export_boundary_splines.py) so they match the track map exactly.
    left_boundary_filename: "left_boundary_spline.csv"
    right_boundary_filename: "right_boundary_spline.csv"
    centerline_filename: "centerline.csv"
    raceline_filename: "traj_race_cl.csv"

frenet_odom_node:
  ros__parameters:
