graph_slam:
  ros__parameters:
    use_sim_time: true

    car_state_topic: /localization/wheel_odom
    cones_topic: /perception/cones

    map_topic: /localization/cone_map
    slam_odom_topic: /localization/ego_odom
    status_topic: ~/status
    lifecycle_diagnostics_topic: /localization/debug/lifecycle_diagnostics
    map_converged_topic: ~/map_converged
    path_topic: /localization/debug/path
    marker_topic: /localization/debug/markers

    map_frame: map
    odom_frame: odom
    slam_base_frame: base_footprint
    publish_tf: true
    tf_stamp_offset: 0.0

    keyframe_distance: 0.5
    keyframe_yaw: 0.2
    keyframe_max_dt: 0.5

    association_max_distance: 1.5
    association_gate_chi2: 5.991
    association_ambiguity_ratio: 0.85

    # Automatic relocalization (localization mode only). Association failure
    # is an ABSORBING state: once the pose drifts past the gate, no amount of
    # further driving brings it back, and the manual /initialpose search
    # (+-2 m) cannot reach a GNSS-outage-sized excursion. Lost = cones
    # visible but zero associations for N consecutive frames (the frozen map
    # creates no landmarks to absorb them); recovery scan-matches around the
    # current estimate with an escalating radius, gated on the inlier count
    # so a bad fit is never applied. An orange-gate match (below) overrides
    # the seed with a drift-independent global fix.
    auto_relocalize_enable: true
    auto_relocalize_min_visible_cones: 3
    # Lost detection is a WEIGHTED score, not a plain frame count: zero
    # associations add 2, a weak frame (< 1/4 of the visible cones matched —
    # the wrong-branch aliasing signature the zero-only detector never saw)
    # adds 1, and the trigger threshold is 2x this value, so plain full-loss
    # latency is unchanged while partial aliasing is caught at half rate.
    auto_relocalize_lost_frames: 10
    auto_relocalize_min_inliers: 4
    auto_relocalize_search_radius: 4.0
    # While GNSS priors are being accepted (sigma+innovation gated), the pose
    # is externally corroborated and the relocalizer stays disarmed; it only
    # fires when anchors have been absent/rejected this long (real outage).
    auto_relocalize_gnss_holdoff_sec: 3.0
    auto_relocalize_max_search_radius: 16.0
    auto_relocalize_cooldown_sec: 3.0
    # Aliased-branch breaker: an aliased pose on a repetitive section keeps
    # matching cones (never zero/weak-match "lost") while sub-sigma RTK
    # fixes fail the innovation gate forever — the self-sealing autocross
    # failure, reproduced live on comp_2021 (5 m offset, 33 matches, lost
    # 0). This many consecutive rejected RTK-grade fixes force a
    # relocalization seeded AT the fix. 0 disables.
    gnss_reject_streak_relocalize: 8

    # ---- Local submap (consecutive-observation constellation) ------------
    # Every scan match (manual /initialpose, auto relocalization, seam
    # anchor) fits the rolling ~20 m trail of cone observations — rigidly
    # connected by short-horizon odometry, deduped per color — instead of a
    # single 3-8 cone frame. A 3-cone frame aliases onto parallel sections
    # (the autocross 40 m mis-registration); a 20 m color-aware constellation
    # is close to unique on any FS track, which is what makes accepting a
    # relocalization safe WITHOUT a GNSS cross-check. Acceptance requires
    # half of the submap points to fit (vs 3/4 of one frame before).
    submap_enable: true
    submap_span_m: 20.0
    submap_max_frames: 250
    submap_dedup_radius_m: 0.6
    # Below this many deduped points the matcher falls back to the latest
    # single frame (startup, long perception dropouts).
    submap_min_match_points: 6

    # ---- GNSS-free lap-seam anchor ---------------------------------------
    # The orange-gate anchor closes the mapping-lap seam only when the gate
    # constellation is visible and correctly classified. This is the
    # fallback that needs NO gate and NO GNSS: once the estimate re-enters
    # seam_anchor_trigger_radius_m of the lap origin (after a real lap of
    # travel), the submap is scan-matched against the START-AREA map only
    # (landmarks near the lap origin, founded early in the lap before drift
    # accumulated — never against cones the submap itself founded, and never
    # against drift-displaced mid-lap cones) and, if enough points verify
    # the pose and the implied correction is between the gate anchor's
    # min/max correction bounds, the current keyframe is re-seeded exactly
    # like the gate anchor — the optimizer then redistributes the drift
    # along the odometry chain. A healthy fresh GNSS fix can veto the
    # candidate (auto_relocalize_max_gnss_residual_m), so with RTK up this
    # can never fight GNSS; without GNSS it is the loop closure.
    seam_anchor_enable: true
    # Must cover the worst credible end-of-lap odometry drift: the true pose
    # sits up to that far from the drifted seed.
    seam_anchor_search_radius_m: 15.0
    # Tight on purpose: gyro-integrated yaw drifts only ~0.05 rad/lap, and a
    # wide yaw window lets the matcher fit curved cone rows at rotated
    # aliases (the 0.35-0.44 rad ghost-map corrections). Candidates beyond
    # 60% of this span are rejected as rotation-aliased.
    seam_anchor_search_yaw: 0.15
    seam_anchor_trigger_radius_m: 30.0
    # 8, not more: at the seam only the post-crossing half of the submap CAN
    # match the start-area targets, so ~10 required inliers blocks the
    # closure outright (verdict-matrix regression). Alias protection against
    # healthy-GNSS runs comes from the GNSS disarm rule, not this count.
    seam_anchor_min_inliers: 8
    seam_anchor_cooldown_travel_m: 10.0
    # Attempt throttle (the grid search is expensive; do not run it on every
    # cone frame inside the trigger radius).
    seam_anchor_attempt_interval_m: 1.0

    # ---- Odometry blind-gap handling -------------------------------------
    # When the motion stream resumes after a gap (INS free-inertial fault ->
    # bridge stops publishing -> re-acquisition), the pull-in transient must
    # not be MAPPED: founding landmarks from it mints an offset copy of
    # everything in view (F2 fault injection: 82 false cones from one 20 s
    # outage). On resume the submap history is dropped and track founding /
    # promotion pause for the quarantine window; association, loop
    # candidates and GNSS priors keep running so the anchors pull the pose
    # back in cleanly.
    odom_gap_reset_sec: 1.0
    odom_gap_quarantine_sec: 6.0

    # GNSS-return recovery (verified re-linearization + drift-era landmark
    # re-seat). Re-enabled 2026-07-21 with visibility-gated verification:
    # with pre-drift landmarks IN VIEW the corrected pose must positively
    # explain them -- cone silence refuses the move (the old "refuse only on
    # negative evidence" rule let every small_track mode-transition apply
    # blind at 0-vs-0 inliers and re-seat the whole map). Only the genuine
    # frontier (no pre-drift map in view) may apply on GNSS coherence alone,
    # which is the pioneering-drift case this exists to treat.
    recovery_enable: true

    # Orange-gate global anchor: the big-orange start-gate cones exist
    # nowhere else on the track, so matching their observed constellation
    # (two gate sides = a rigid 2-point body) against the mapped one yields
    # an SE2 fix whose validity does not depend on drift size — the one
    # loop closure per-cone NN association can never provide. While mapping,
    # a verified match beyond gate_anchor_min_correction_m re-seeds the
    # current keyframe onto the gate-aligned pose so the optimizer closes
    # the lap seam instead of duplicating the map (the GNSS-fault failure
    # mode); in localization mode it seeds the auto relocalization.
    # Left/right correspondence and the 180-degree flip are disambiguated by
    # counting how many of ALL visible cones the candidate pose explains.
    # Observations tolerate the big/small-orange misclassification (routine
    # for vision at range); the map side stays big-orange-only so small
    # orange lane markings can never form a false gate.
    gate_anchor_enable: true
    gate_anchor_cluster_radius_m: 1.5
    gate_anchor_pair_tolerance_m: 0.5
    gate_anchor_min_pair_separation_m: 2.0
    gate_anchor_max_pair_separation_m: 9.0
    gate_anchor_min_inliers: 4
    gate_anchor_min_correction_m: 2.4
    gate_anchor_max_correction_m: 60.0
    gate_anchor_cooldown_travel_m: 5.0
    # Gate inflation grows with distance driven since a landmark was last
    # seen (drift is distance-proportional; keyframe density must not change
    # the gate). 0.01 m^2/m -> ~3.2 m gate radius after a 165 m lap.
    association_inflation_per_meter: 0.01
    association_max_inflation: 4.0
    min_observation_range: 0.2
    max_observation_range: 30.0

    # ---- Delayed data association (tentative-track frontend) -------------
    # Observations no longer found landmarks directly. An unmatched cone
    # founds a TENTATIVE track outside the graph; only a track with enough
    # hits AND a converged position is promoted to a landmark, and promotion
    # replays its buffered observations against the original keyframes (the
    # delay costs no information). This retires the legacy creation
    # heuristics (creation_max_range / near_range / crowd_radius /
    # founding_heading_sigma) — a bad track dies without ever touching the
    # map. Values follow the MOT/cone-SLAM literature (Dissanayake tentative
    # lists, ORB-SLAM probation, AMZ counters).
    # Correlated heading-lever error: promotion demands the track's CLOSEST
    # sighting have lever sigma below the cap, so far-only tracks (born at
    # 10 m+) cannot promote until a near pass refines them.
    heading_lever_sigma_rad: 0.035
    track_gate_chi2: 9.21
    track_gate_max_distance: 2.4
    track_promote_min_hits: 3
    track_promote_max_sigma: 0.35
    # Far-promotion relief (missing-teeth fix): a cone only ever seen at
    # range carries a lever-sigma floor above the cap and would NEVER
    # promote — a permanent hole in the map. With this many hits it promotes
    # anyway, carrying its honest wide covariance into the graph.
    track_promote_far_min_hits: 6
    track_promote_far_max_sigma: 0.7
    # A confirmable track sitting within this radius of a confirmed landmark
    # is a drift-offset re-sighting of that cone (the old "offset twin"):
    # promotion is HELD until loop closure resolves the drift.
    track_promote_hold_radius: 2.0
    # Hold only against a STALE neighbour (a fresh one = two real cones).
    track_promote_hold_stale_travel: 5.0
    # Against a LAP-OLD stale neighbour (>= this much travel unseen) the hold
    # radius additionally grows by the drift inflation (3*sqrt), so
    # seam-crossing drift twins cannot promote 3-5 m from their originals.
    # Scope is intentionally narrow (only near landmarks unseen for 60+ m of
    # travel, i.e. the lap seam); general missing-teeth relief comes from
    # the far-promotion path above, NOT from disabling this — disabling it
    # let seam twins flood the map (extras 128 in the verdict matrix).
    track_promote_hold_drift_stale: 60.0
    # 6, not 3: real (YOLO) perception at ~8 Hz flickers on far cones, and a
    # 3-miss budget killed tracks faster than they could bank 3 hits — the
    # comp_2021 map froze at 63% coverage from promotion starvation alone.
    track_kill_consecutive_misses: 6
    track_kill_unpromoted_travel: 25.0

    use_cone_covariance: true
    default_observation_sigma: 0.25
    min_observation_variance: 0.01
    # Robust backend on cone observation edges: DCS (Dynamic Covariance
    # Scaling, Agarwal ICRA'13) = closed-form switchable constraints. A
    # mis-associated edge is smoothly switched off (weight 2*phi/(phi+chi2))
    # instead of dragging the map; inlier edges (chi2 <= phi) are untouched.
    # phi=1.0 is the literature default (safe band ~0.1-10). Set to "huber"
    # to fall back to the legacy kernel, "none" to disable.
    observation_robust_kernel: dcs
    observation_dcs_phi: 1.0
    robust_kernel_delta: 1.0

    # Floors only — with use_odom_covariance the channel's own reported sigma
    # rides above these. Lowered 2026-07-16: wheel odometry now compensates
    # traction slip and reports honest per-sample sigma (~0.01/0.001), and the
    # old floors were silently re-inflating it 5x/30x. The SBG channel is
    # unaffected (its reported 0.05 sits above either floor).
    odom_translation_sigma: 0.02
    odom_yaw_sigma: 0.01
    # Consume the motion source's reported noise (CarState.pose.covariance)
    # per odometry edge, clamped below by the sigmas above — a degraded
    # bridge/wheel-odometry mode then weakens its own constraints.
    use_odom_covariance: true
    # Distance-proportional floor on the EDGE sigma: the reported covariance
    # is per-sample, but a keyframe edge integrates ~10+ samples plus
    # correlated error (slip, yaw leverage). Believing 2 cm for a 0.5-1 m
    # edge made the chain so stiff that loop closures could not bend the
    # first-lap drift out of the map (the residual global warp). ~8 %/m
    # translation, 0.5 deg/m yaw.
    odom_edge_sigma_per_meter: 0.08
    odom_edge_yaw_sigma_per_meter: 0.008

    # GNSS global anchor (Level 2): consume the SBG bridge's /localization/gnss_odom absolute
    # ENU fix as a unary EdgeSE2XYPrior on each keyframe. gnss_prior_max_position_sigma
    # gates it so only mode-4/RTK fixes (small covariance) anchor the graph;
    # degraded modes publish a huge covariance and are dropped automatically, so
    # the anchor fades out gracefully on RTK dropout while odometry keeps flowing.
    gnss_prior_enable: true
    gnss_prior_topic: /localization/gnss_odom
    # Accept DEGRADED fixes with their honest (large) sigma instead of
    # dropping them: a 1-2 m anchor at 2 Hz still bounds a sustained GM
    # excursion, which is what prevents the drifted second-copy overlay
    # (2026-07-18 F1: 57 ghosts with anchors gated off entirely).
    gnss_prior_max_position_sigma: 3.0
    # Once the map is FROZEN it is the trusted reference: degraded
    # (float/single) anchors only fight it — one sustained single-point
    # window produced 26 lost/relocalize cycles (F1 fault injection). In
    # localization mode only RTK-grade fixes may anchor the pose.
    gnss_prior_loc_max_position_sigma: 0.5
    gnss_prior_max_age: 0.3
    gnss_prior_robust_delta: 1.0
    # Believed-not-realized INS (2026-07-16 fidelity pass): the reported sigma
    # is a deterministic surrogate that can be confidently wrong while the
    # realized error is a slow Gauss-Markov excursion. Three defenses:
    # floor any single prior's weight; take at most one prior per interval
    # (inside it, consecutive fixes share the same error draw); and once the
    # map has converged, reject fixes that disagree with the cone-anchored
    # pose by more than the rearm budget.
    gnss_prior_min_sigma: 0.25
    # Pre-convergence the anchors only need to bound gross odometry drift;
    # at full strength their correlated (GM) error drags the elastic graph in
    # optimizer steps and splits associations (duplicate cones, the race
    # mapping failure). x4 keeps the pull ~16x weaker until the map freezes.
    gnss_prior_mapping_sigma_scale: 2.0
    gnss_prior_min_interval: 0.5
    gnss_prior_innovation_max_residual: 2.0
    # A manual /initialpose (RViz 2D Pose Estimate) suppresses the priors so an
    # RTK fix cannot yank the pose straight back to GNSS; they re-arm after
    # suppress_duration once GNSS agrees with the cone-anchored pose within
    # rearm_max_residual. If the map is NOT georeferenced (old local-frame
    # map / different datum), set gnss_prior_enable to false instead.
    gnss_prior_suppress_duration: 20.0
    gnss_prior_rearm_max_residual: 2.0

    # Optimize on every perception frame that adds edges (conesCallback calls
    # maybeOptimize); these gates just rate-limit it. optimize_every_n_keyframes
    # = 1 means "as soon as there is a new keyframe of observations", and
    # optimize_min_interval caps the solver rate so drift is corrected
    # continuously instead of every N keyframes.
    optimize_every_n_keyframes: 1
    optimize_min_interval: 0.1
    max_optimization_poses: 4000
    # 10 -> 30 (same autopsy): every logged optimizer call exhausted its 10
    # iterations — the graph ran chronically unconverged, so each call
    # published a different partial solution and the live pose stepped
    # 0.06-0.29 m per call (the visible map/ego stutter, and the pose noise
    # behind the far-range duplicate births above).
    optimization_iterations: 30
    process_every_cone_message: false

    # 3 (the confirm threshold) was trialed 2026-07-16 in the map-pollution
    # A/B; bundled with the ghost reaper it regressed gen_s7_l250 (fp 1->3,
    # rmse 30->68 mm), so it stays at 2 until the reaper ablation separates
    # the two. See the A/B table in the session notes / commit message.
    landmark_min_observations_to_publish: 2
    landmark_confirm_observations: 3
    loop_gap_distance: 20.0
    loop_confirmation_required_candidates: 3
    loop_confirmation_min_travel_m: 2.0
    loop_confirmation_min_elapsed_sec: 1.0
    loop_confirmation_median_residual_max_m: 1.0
    loop_confirmation_max_residual_m: 2.0
    landmark_merge_distance: 0.85
    # After the map converges (loop closures reconciled by this many
    # optimization cycles), confirmed-landmark observation edges get their
    # information scaled up so the pose conforms to the settled map.
    map_trust_after_loop_closure: true
    map_trust_loop_closures_required: 1
    map_trust_info_scale: 3.0
    # Must exceed the biggest track's cone count with duplicate headroom —
    # at 400 the node silently stopped mapping hairpins (984 GT cones) at
    # cap and the map simply ended mid-track.
    max_landmarks: 1200
    update_existing_landmarks: true
    # 0.3, not 1.0 (2026-07-20 field feedback): full-gain Kalman writes made
    # every landmark chase its newest observation between optimizer runs —
    # the visible map jitter during registration. The 10 Hz optimizer is the
    # principled fuser; this update is only a gentle warm start now.
    landmark_update_gain: 0.3
    landmark_update_process_variance: 0.01
    # The ghost reaper: a landmark that should be visible (range/FOV checks)
    # but keeps missing gets deleted (6 misses unconfirmed / 60 confirmed).
    # perception.yaml's contract says existence doubt is SLAM's to hold — with
    # this off, a published ghost lives forever. Trialed ON 2026-07-16: killed
    # all 5 ghosts on boa_constrictor but regressed gen_s7_l250 (dup +1, rmse
    # 30->68 mm) — a 6-miss budget also reaps REAL cones during ~1 s
    # occlusions and the recreation churn costs more than the ghosts did.
    # Re-try with landmark_missed_observations_to_delete ~20 once the lidar
    # realism pipeline settles; until then the creation range gate alone is
    # the pollution defense.
    delete_stale_landmarks: true
    landmark_missed_observations_to_delete: 6
    landmark_delete_min_interval: 0.2
    # CONSERVATIVE visibility envelope for miss-counting (2026-07-20 field
    # feedback): a miss is only evidence of absence when the cone is WELL
    # inside what the camera reliably sees. 180 deg / 30 m counted misses on
    # cones the sensor could never confirm, and far cones got reaped.
    landmark_delete_fov: 1.5
    landmark_delete_max_range: 10.0
    landmark_delete_max_abs_x: 20.0
    landmark_delete_max_abs_y: 20.0
    path_max_poses_to_publish: 1000
    visual_publish_min_interval: 0.5
    marker_scale: 0.3

    g2o_output_path: /tmp/hyu_localization.g2o

    # Localization-only mode: load a saved cone map (CSV) as a fixed reference
    # and optimise only the pose against it (no mapping/deletion/merge).
    # load_map_path is usually set by the launch/GUI. map_save_dir defaults to
    # the package map/ directory when launched via graph_slam.launch.py.
    localization_mode: false
    load_map_path: ""
    # Frozen-but-self-healing map: with a HEALTHY pose (nothing lost), a
    # track that clears a much stricter bar (loc_repair_min_hits) may fill a
    # hole in the frozen map, and a landmark repeatedly expected-visible yet
    # never observed (loc_repair_missed_to_delete consecutive misses) is
    # reaped — big-orange gate cones never are. A wrong reap re-adds itself
    # through the same path, so the repair is self-correcting both ways.
    loc_map_repair_enable: true
    loc_repair_min_hits: 6
    loc_repair_missed_to_delete: 6

    # Trackdrive lifecycle: once the map is converged and the car returns
    # within lap_return_radius / lap_return_yaw of the captured lap origin,
    # freeze the map (auto-saved to map_save_dir), switch to localization, and
    # keep only the most recent localization_window_poses pose vertices so the
    # graph stays bounded for arbitrarily many laps. Status is published on
    # ~/status and ~/map_converged (latched) for planning / RViz.
    auto_localization_after_lap: true
    # The lap origin is captured this far into the drive so it sits on the
    # racing line (the spawn pose can be offset from the driven line).
    lap_origin_capture_distance: 15.0
    lap_return_radius: 6.0
    lap_return_yaw: 1.0
    localization_window_poses: 100
    # Freeze-quality gates. map_converged alone accepts ANY confirmed loop —
    # on a waisted track (peanut) that can be a mid-lap mini-loop that says
    # nothing about full-lap drift. Require seam evidence (loop candidates
    # re-associating landmarks within lap_seam_landmark_radius_m of the lap
    # origin) before the freeze, then dwell lap_finish_dwell_m so the seam
    # accumulates constraints before landmarks are fixed.
    require_lap_seam_loop_closure: true
    lap_seam_landmark_radius_m: 10.0
    lap_seam_candidates_required: 2
    lap_finish_dwell_m: 5.0
    # A verified lap return independently corroborates a loop closure: relax
    # the confirmation window to this many candidates once the car is back at
    # the origin (residual gates are never relaxed). 0 disables.
    loop_confirmation_required_candidates_on_lap_return: 2
    # The origin is captured while standing on it, so a "return" only counts
    # after this much further travel (guards the relaxation and the finish
    # gate against the trivial same-pose match at capture).
    lap_return_min_travel_m: 50.0
    # Freeze-time drift-duplicate sweep: same-color pairs within this radius
    # merge into the recently-seen member IF their last observations are a
    # loop_gap_distance of travel apart (a stale twin from failed association
    # under drift). Distance alone cannot do this — real same-color cones
    # stand as close as ~1.0 m in tight corners.
    freeze_merge_stale_distance_m: 4.5
