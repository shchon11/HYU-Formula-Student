graph_slam:
  ros__parameters:
    use_sim_time: true

    # ==== Topics / frames (contract — rarely touched) =====================
    # publish
    car_state_topic: /localization/wheel_odom
    map_topic: /localization/cone_map
    slam_odom_topic: /localization/ego_odom
    # subscribe
    cones_topic: /perception/cones

    status_topic: ~/status
    lifecycle_diagnostics_topic: /localization/debug/lifecycle_diagnostics
    map_converged_topic: ~/map_converged
    path_topic: /localization/debug/path
    marker_topic: /localization/debug/markers

    #==== Frames ===========================================================
    map_frame: map
    odom_frame: odom
    slam_base_frame: base_footprint
    publish_tf: true
    tf_stamp_offset: 0.0

    g2o_output_path: /tmp/hyu_localization.g2o
    localization_mode: false
    load_map_path: ""

    # ==== Odometry trust (prediction quality) =============================
    # Keyframe cadence: one pose vertex per this much motion.
    keyframe_distance: 0.5
    keyframe_yaw: 0.2
    keyframe_max_dt: 0.5
    # Floors only — with use_odom_covariance the source's reported sigma
    # rides above these.
    odom_translation_sigma: 0.02
    odom_yaw_sigma: 0.01
    use_odom_covariance: true
    # Distance-proportional EDGE sigma floor: reported covariance is
    # per-sample; a keyframe edge integrates many samples + correlated slip.
    # Too stiff a chain stops loop closures from bending drift out.
    odom_edge_sigma_per_meter: 0.08
    odom_edge_yaw_sigma_per_meter: 0.008

    # ==== CSM registration (THE correction mechanism) =====================
    # Correlative matching of the submap constellation against the cone map
    # (correlation_grid.hpp). Tracking mode: tight window, full map, keeps
    # drift below the association gate continuously. Loop mode: wide window,
    # start-area map only, orange-gate-decided, closes the lap seam.
    csm_enable: true
    csm_resolution: 0.05          # fine grid cell (m); QUT used 5 cm
    csm_smear_sigma: 0.2          # cone Gaussian smear (m): cone radius + perception noise
    csm_min_query_points: 10      # constellation size floor (chain-length analog)
    csm_min_interval_m: 1.0       # attempt cadence (m of travel)
    csm_apply_cooldown_m: 2.0     # after an APPLY, let the optimizer settle
    # --- tracking mode ---
    csm_track_window_m: 2.0
    csm_track_window_theta: 0.17
    csm_fine_response_min: 0.45   # tracking acceptance floor
    csm_coarse_response_min: 0.35
    # --- loop (seam) mode: fires only with >= 2 orange in the submap, after
    # lap_return_min_travel_m since the origin, at most 3 applies ---
    csm_loop_window_m: 6.0        # must cover worst end-of-lap drift
    csm_loop_window_theta: 0.35
    csm_loop_min_response: 0.60           # full-constellation refine floor
    csm_loop_min_orange_response: 0.5     # stage-1: the gate itself must fit
    csm_orange_weight: 10.0               # gate dominance in mixed scoring
    # Only lidar-grade orange observations carry gate credentials; ZNCC-depth
    # (vision-only) orange has meters of range variance and is demoted to
    # unknown geometry in the submap. Lidar-fused cones publish variance
    # 0.070 (sigma ~0.26 with the 4x-headroom policy) — the bound sits above
    # that, below vision depth sigma.
    csm_orange_max_obs_sigma: 0.45
    # --- acceptance safety (both modes) ---
    csm_max_sigma_xy: 1.2         # peak-basin sharpness bound (alias ridge ~4 m)
    csm_max_sigma_theta: 0.05
    csm_peak_margin: 0.10         # best must beat any out-of-basin hypothesis by this

    # ==== Data association (frontend) =====================================
    association_max_distance: 1.5
    association_gate_chi2: 5.991
    association_ambiguity_ratio: 0.85
    # Gate inflation with distance since the landmark was last seen.
    association_inflation_per_meter: 0.01
    association_max_inflation: 4.0
    min_observation_range: 0.2
    max_observation_range: 30.0
    # Tentative-track founding: unmatched cones found tracks OUTSIDE the
    # graph; only confirmed, converged tracks become landmarks.
    heading_lever_sigma_rad: 0.035
    track_gate_chi2: 9.21
    track_gate_max_distance: 2.4
    track_promote_min_hits: 3
    track_promote_max_sigma: 0.35
    track_promote_far_min_hits: 6     # far-only cones promote late with honest sigma
    track_promote_far_max_sigma: 0.7
    track_promote_hold_radius: 2.0    # drift-twin hold near stale confirmed landmarks
    track_promote_hold_stale_travel: 5.0
    track_promote_hold_drift_stale: 60.0
    track_kill_consecutive_misses: 6  # YOLO flicker headroom (3 starved promotion)
    track_kill_unpromoted_travel: 25.0
    # Visibility model for track miss-counting (frontend): misses only count
    # where the track SHOULD be visible.
    track_visible_max_range: 30.0
    track_visible_fov: 3.14159

    # ==== Observation edges / optimizer ===================================
    use_cone_covariance: true
    default_observation_sigma: 0.25
    min_observation_variance: 0.01
    observation_robust_kernel: huber   # huber | none (loop edges always huber)
    robust_kernel_delta: 1.0
    optimize_every_n_keyframes: 1
    optimize_min_interval: 0.1
    optimization_iterations: 30        # 10 ran chronically unconverged (pose stutter)
    max_optimization_poses: 4000
    process_every_cone_message: false

    # ==== Map maintenance =================================================
    landmark_min_observations_to_publish: 2
    landmark_confirm_observations: 3
    # A re-association of a landmark unseen for this much travel is a loop
    # edge (huber, pulls optimization forward).
    loop_gap_distance: 20.0
    max_landmarks: 1200               # must exceed biggest track + headroom
    update_existing_landmarks: true
    landmark_update_gain: 0.3         # gentle warm start; the optimizer is the fuser
    landmark_update_process_variance: 0.01
    # Registered-but-unobserved reaper: a landmark WELL inside the
    # conservative envelope below that keeps missing (counted once per
    # keyframe) is a ghost. Big-orange gate cones are never reaped. A 6-miss
    # budget once ate occluded real cones — keep this generous.
    landmark_delete_enable: true
    landmark_delete_misses: 5
    landmark_delete_max_range: 10.0
    landmark_delete_fov: 1.5

    # ==== Lap lifecycle (freeze -> localization) ==========================
    # Freeze requires: lap-return geometry (radius+yaw after min travel from
    # the origin) AND seam evidence (a CSM loop apply, or a reconciled
    # vanilla loop edge). The global planner starts once status flips to
    # "localization", so this chain IS the global-path latency.
    auto_localization_after_lap: true
    lap_origin_capture_distance: 15.0
    lap_return_radius: 6.0
    lap_return_yaw: 1.0
    lap_return_min_travel_m: 50.0
    # Freeze on the Nth certified lap return. Lap 2 lays revisit loop edges
    # along the WHOLE track so first-lap drift is ironed out before landmarks
    # fix (boa froze a 0.65 m warp at N=1). N=1 = fastest global path.
    lap_returns_to_freeze: 1
    localization_window_poses: 100

    # ==== Submap (CSM query constellation) ================================
    submap_enable: true
    submap_span_m: 20.0
    submap_max_frames: 250
    submap_dedup_radius_m: 0.6
    submap_min_match_points: 6

    # ==== Manual relocalization (RViz /initialpose) =======================
    relocalize_search_radius: 2.0
    relocalize_search_yaw: 0.5
    relocalize_inlier_distance: 0.6

    # ==== Visualization ===================================================
    path_max_poses_to_publish: 1000
    visual_publish_min_interval: 0.5
    marker_scale: 0.3
