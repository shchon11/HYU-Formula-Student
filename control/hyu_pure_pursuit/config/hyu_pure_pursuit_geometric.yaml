# Kinematic pure pursuit (fixed lookahead) trackdrive tune. This was the default
# before MAP; keep it as a fallback. To run trackdrive with geometric steering:
#   ros2 launch hyu_planning_bringup local_global_planning.launch.py \
#     controller_params_file:=<share>/hyu_pure_pursuit/config/hyu_pure_pursuit_geometric.yaml
hyu_pure_pursuit_node:
  ros__parameters:
    steering_mode: geometric
    wheelbase_m: 1.58
    lookahead_m: 6.0
    max_steering_rad: 0.52
    command_rate_hz: 20.0
    input_timeout_sec: 0.5
    max_speed_mps: 10.0
    longitudinal_kp: 1.2
    min_acceleration_mps2: -8.0
    max_acceleration_mps2: 2.5
    # Deceleration on a hard brake (invalid/stale path, stop request). The
    # in-path floor above (min_acceleration) is separate.
    brake_acceleration_mps2: -5.0
